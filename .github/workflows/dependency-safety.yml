name: Frontend dependency safety fixtures

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selective non-mutation and duplicate discovery
        shell: pwsh
        run: ./tests/test_toolchain_safety.ps1
      - name: Verify guided install remains read-only and conflict-aware
        shell: pwsh
        run: ./tests/test_dependency_install_plan.ps1
      - name: Verify accessibility authority and bundled ownership
        shell: pwsh
        run: ./tests/test_accessibility_architecture.ps1
      - name: Verify Taste design routing and anti-loop authority
        shell: pwsh
        run: ./tests/test_design_routing.ps1
      - name: Verify live specialist preflight and mutation boundaries
        shell: pwsh
        run: ./tests/test_specialist_preflight_policy.ps1
