schema_version: 1

orchestrator:
  name: frontend-production-qa

required:
  skills:
    - name: frontend-ui-engineering
      provider: addyosmani/agent-skills
    - name: browser-testing-with-devtools
      provider: addyosmani/agent-skills
  mcp:
    - name: chrome-devtools
      provider: ChromeDevTools/chrome-devtools-mcp

bundled:
  skills:
    - name: frontend-visual-qa
      path: ./skills/frontend-visual-qa
    - name: frontend-accessibility-qa
      path: ./skills/frontend-accessibility-qa
  mcp:
    - name: inspo
      provider: Nutlope/inspo
      transport: streamable-http
      url: https://inspomcp.dev/api/mcp
      required: false

recommended:
  - name: impeccable
    provider: pbakaus/impeccable
  - name: motion
    provider: motiondivision/ai-kit
  - name: design-taste-frontend
    provider: Leonxlnx/taste-skill
  - name: ui-designer
    provider: daymade/claude-code-skills
  - name: qa-expert
    provider: daymade/claude-code-skills

optional_unmanaged:
  - karpathy-guidelines
  - context-engineering
  - maintain-project-memory
